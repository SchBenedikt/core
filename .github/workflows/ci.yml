name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI package
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up PHP for route parity
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: openssl, pdo_sqlite, mbstring, curl
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck the UI package
        working-directory: ui
        run: npm run typecheck

      - name: Test the UI package
        working-directory: ui
        run: npm test

      - name: Verify release artifacts
        run: composer check:release

  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The attribution guard must see the complete history.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, pdo_sqlite, mbstring, curl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate release tag against package versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          core_version="$(php -r 'require "vendor/autoload.php"; echo AlohaSocial\Core\Version::CURRENT;')"
          ui_version="$(php -r '$j = json_decode(file_get_contents("ui/package.json"), true, 512, JSON_THROW_ON_ERROR); echo $j["version"];')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$core_version" ] || [ "$tag_version" != "$ui_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match core $core_version and UI $ui_version." >&2
            exit 1
          fi

      - name: Run the gate
        run: composer check

      - name: Export the HTTP contract
        run: php bin/export-routes > routes.json

      - name: Upload the route manifest
        uses: actions/upload-artifact@v4
        with:
          name: routes-php-${{ matrix.php }}
          path: routes.json
          if-no-files-found: error
