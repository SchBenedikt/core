name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: openssl, pdo_sqlite, pdo_mysql, mbstring, curl
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Validate package versions against the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          core_version="$(php -r 'require "vendor/autoload.php"; echo AlohaSocial\Core\Version::CURRENT;')"
          ui_version="$(node -e 'process.stdout.write(require("./ui/package.json").version)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$core_version" ] || [ "$tag_version" != "$ui_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match core $core_version and UI $ui_version." >&2
            exit 1
          fi

      - name: Require an annotated tag verified by GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_type="$(git cat-file -t "$tag_ref")"
          if [ "$tag_type" != tag ]; then
            echo "Release tags must be annotated and signed." >&2
            exit 1
          fi
          tag_object="$(git rev-parse "$tag_ref")"
          tag_endpoint="repos/$GITHUB_REPOSITORY/git/tags/$tag_object"
          tag_target="$(gh api "$tag_endpoint" --jq '.object.sha')"
          verified="$(gh api "$tag_endpoint" --jq '.verification.verified')"
          if [ "$verified" != true ]; then
            echo "GitHub could not verify the signature on $GITHUB_REF_NAME." >&2
            exit 1
          fi
          if [ "$tag_target" != "$GITHUB_SHA" ]; then
            echo "The signed tag target differs from the commit being built." >&2
            exit 1
          fi

      - name: Run the core gate
        run: composer check

      - name: Typecheck and test the UI
        working-directory: ui
        run: |
          npm run typecheck
          npm test

      - name: Build and verify artifacts
        run: bash tools/release-check.sh

      - name: Attest release packages
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            var/release/alohasocial-core.tar
            var/release/alohasocial-ui-*.tgz

      - name: Create the versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            existing="$(mktemp -d)"
            trap 'rm -rf "$existing"' EXIT
            gh release download "$release_tag" --dir "$existing"
            (cd "$existing" && sha256sum --check SHA256SUMS)
            diff -u "$existing/SHA256SUMS" var/release/SHA256SUMS
            echo "Release $release_tag already contains these verified artifacts."
            exit 0
          fi
          gh release create "$release_tag" var/release/alohasocial-core.tar var/release/alohasocial-ui-*.tgz var/release/SHA256SUMS \
            --verify-tag \
            --title "Aloha Social $release_tag" \
            --generate-notes

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: var/release/*
          if-no-files-found: error
